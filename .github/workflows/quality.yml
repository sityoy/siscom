name: SIS.COM Quality Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prepare environment
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate

      - name: Validate PHP syntax
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate Composer
        run: |
          composer validate --no-check-publish
          composer audit --locked --no-dev

      - name: Run tests
        run: php artisan test

      - name: Build frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Verify deployment script
        run: bash -n deploy.sh
